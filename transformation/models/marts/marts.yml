version: 2

models:
  - name: dim_city
    description: One row per city, with attributes taken from its most recent measured year.
    columns:
      - name: city_key
        description: Surrogate key for the city.
        tests:
          - not_null
          - unique
      - name: country_code
        tests:
          - not_null
      - name: measured_years
        description: How many distinct years this city has been measured in.
        tests:
          - not_null

  - name: fct_air_quality_yearly
    description: One row per city and year, with pollutant concentrations and the PM2.5 guideline band.
    columns:
      - name: city_key
        description: Foreign key to dim_city.
        tests:
          - not_null
          - relationships:
              to: ref('dim_city')
              field: city_key
      - name: measurement_year
        tests:
          - not_null
      - name: pm25_guideline_band
        description: Which WHO PM2.5 band the city-year falls into, or not_reported.
        tests:
          - accepted_values:
              values:
                - within_guideline
                - interim_target_4
                - interim_target_3
                - above_interim_targets
                - not_reported

  - name: dim_account
    description: "One row per Salesforce Account. Grain: one row per account_id."
    contracts:
      enforced: true
    columns:
      - name: account_id
        description: Salesforce Account ID.
        data_type: text
        tests:
          - not_null
          - unique
      - name: account_name
        data_type: text
        tests:
          - not_null
      - name: type
        data_type: text
      - name: industry
        data_type: text
      - name: annual_revenue
        data_type: double
      - name: number_of_employees
        data_type: integer
      - name: ownership
        data_type: text
      - name: ticker_symbol
        data_type: text
      - name: rating
        data_type: text
      - name: phone
        data_type: text
      - name: fax
        data_type: text
      - name: website
        data_type: text
      - name: billing_street
        data_type: text
      - name: billing_city
        data_type: text
      - name: billing_state
        data_type: text
      - name: billing_postal_code
        data_type: text
      - name: billing_country
        data_type: text
      - name: shipping_street
        data_type: text
      - name: shipping_city
        data_type: text
      - name: shipping_state
        data_type: text
      - name: shipping_postal_code
        data_type: text
      - name: shipping_country
        data_type: text
      - name: description
        data_type: text
      - name: owner_id
        data_type: text
      - name: created_date
        data_type: timestamp
      - name: last_modified_date
        data_type: timestamp
      - name: system_modstamp
        data_type: timestamp
      - name: is_partner
        data_type: boolean
      - name: is_customer_portal
        data_type: boolean
      - name: clean_status
        data_type: text
      - name: customer_priority
        data_type: text
      - name: sla
        data_type: text
      - name: active
        data_type: boolean
      - name: number_of_locations
        data_type: integer
      - name: upsell_opportunity
        data_type: text
      - name: sla_serial_number
        data_type: text
      - name: sla_expiration_date
        data_type: date
      - name: last_viewed_date
        data_type: timestamp
      - name: last_referenced_date
        data_type: timestamp
      - name: _loaded_at
        data_type: timestamp
        description: Timestamp when this row was loaded.
      - name: _dbt_invocation_id
        data_type: text
        description: Unique identifier for the dbt invocation.
      - name: _git_sha
        data_type: text
        description: Git SHA of the commit that produced this row.

  - name: dim_contact
    description: "One row per Salesforce Contact. Grain: one row per contact_id."
    contracts:
      enforced: true
    columns:
      - name: contact_id
        description: Salesforce Contact ID.
        data_type: text
        tests:
          - not_null
          - unique
      - name: salutation
        data_type: text
      - name: first_name
        data_type: text
        tests:
          - not_null
      - name: last_name
        data_type: text
