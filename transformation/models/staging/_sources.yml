version: 2

sources:
  - name: who
    description: WHO reference data published as a shared MotherDuck sample database.
    database: sample_data
    schema: who
    tables:
      - name: ambient_air_quality
        description: One measurement row per city, year and monitoring programme version.

  - name: salesforce
    description: Salesforce CRM objects ingested via dlt verified source.
    schema: main
    tables:
      - name: account
        description: Salesforce Account objects (one row per account).
      - name: contact
        description: Salesforce Contact objects (one row per contact).
