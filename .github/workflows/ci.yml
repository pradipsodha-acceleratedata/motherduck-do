name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-dbt:
    name: Validate dbt project
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformation

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dbt-duckdb
        run: uv pip install --system dbt-duckdb

      - name: Create CI profiles.yml
        run: |
          mkdir -p ci_profiles
          cat > ci_profiles/profiles.yml << 'EOF'
          ci:
            target: dev
            outputs:
              dev:
                type: duckdb
                path: ":memory:"
                schema: ci
          EOF

      - name: Debug dbt project
        run: uv run dbt debug --profile ci --profiles-dir ci_profiles

      - name: Parse dbt project (validate SQL + YAML)
        run: uv run dbt parse --profile ci --profiles-dir ci_profiles

  lint-python:
    name: Lint Python sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Run ruff check
        run: uv run ruff check ingestion/ sources/ || uv run ruff check --exit-zero ingestion/ sources/

      - name: Run ruff format check
        run: uv run ruff format --check ingestion/ sources/ || echo "format check non-fatal"

  lint-python:
    name: Lint Python sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Run ruff check
        run: uv run ruff check ingestion/ sources/ || uv run ruff check --exit-zero ingestion/ sources/

      - name: Run ruff format check
        run: uv run ruff format --check ingestion/ sources/ || echo "format check non-fatal"